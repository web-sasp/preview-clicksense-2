<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercado Negro | ClickSense RP</title>
<!-- Google Fonts & FontAwesome -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg-main: #08050c;
    --bg-card: #120b1c;
    --bg-card-hover: #1a102b;
    --border-color: rgba(239, 68, 68, 0.25);
    --text-primary: #f3f4f6;
    --text-muted: #9ca3af;
    --accent-red: #ef4444;
    --accent-purple: #a855f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: rgba(8, 5, 12, 0.9); border-radius: 10px; }
::-webkit-scrollbar-thumb { background: rgba(239, 68, 68, 0.35); border-radius: 10px; border: 1px solid rgba(239, 68, 68, 0.2); }
::-webkit-scrollbar-thumb:hover { background: var(--accent-red); }

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    min-height: 100vh;
    padding: 30px 20px;
    overflow-x: hidden;
    perspective: 1400px;
}

.grid-background {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-image: linear-gradient(to right, rgba(239, 68, 68, 0.02) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(168, 85, 247, 0.02) 1px, transparent 1px);
    background-size: 40px 40px; z-index: 0; pointer-events: none;
}

.market-container {
    max-width: 1200px; margin: 0 auto; position: relative; z-index: 10;
}

/* Cabecera del Mercado Clandestino */
.market-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px; flex-wrap: wrap; gap: 15px;
}
.market-title-area h1 {
    font-size: 26px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg, #fff 20%, #f87171 60%, #a855f7 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.market-title-area p { font-size: 13.5px; color: var(--text-muted); margin-top: 4px; }

.cart-indicator-btn {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(168, 85, 247, 0.2));
    border: 1px solid rgba(239, 68, 68, 0.4); color: #fff; padding: 10px 20px; border-radius: 12px;
    cursor: pointer; font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; transition: 0.25s;
}
.cart-indicator-btn:hover { background: rgba(239, 68, 68, 0.35); border-color: var(--accent-red); }
.cart-badge { background: var(--accent-red); color: #fff; padding: 2px 8px; border-radius: 20px; font-size: 11.5px; font-weight: 700; }

/* Grid de Armas */
.weapons-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px;
}

/* Tarjeta con efecto 3D dinámico */
.weapon-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 18px;
    padding: 22px;
    display: flex; flex-direction: column; justify-content: space-between;
    transform-style: preserve-3d; will-change: transform;
    transition: transform 0.15s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.weapon-card:hover {
    border-color: rgba(239, 68, 68, 0.6);
    box-shadow: 0 15px 40px rgba(239, 68, 68, 0.18), 0 0 25px rgba(168, 85, 247, 0.1);
}

.weapon-img-wrapper {
    height: 140px; display: flex; align-items: center; justify-content: center; position: relative;
    transform: translateZ(30px); margin-bottom: 15px;
}
.weapon-img-wrapper img {
    max-width: 100%; max-height: 120px; object-fit: contain;
    filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
    transition: transform 0.3s ease;
}
.weapon-card:hover .weapon-img-wrapper img { transform: scale(1.08) translateZ(10px); }

.weapon-info { transform: translateZ(20px); margin-bottom: 15px; }
.weapon-category { font-size: 11px; color: var(--accent-purple); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; display: block; }
.weapon-name { font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.weapon-desc { font-size: 12.5px; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px; }
.weapon-price { font-size: 18px; font-weight: 800; color: #10b981; display: flex; align-items: center; gap: 6px; }
.weapon-price span { font-size: 12px; color: var(--text-muted); font-weight: 500; }

.buy-btn {
    transform: translateZ(40px);
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(168, 85, 247, 0.25));
    border: 1px solid rgba(239, 68, 68, 0.4); color: #fff; width: 100%; padding: 11px;
    border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: 0.25s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.buy-btn:hover { background: var(--accent-red); border-color: var(--accent-red); box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4); }

/* Modal del Carrito */
.modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s;
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-box {
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px;
    width: 90%; max-width: 500px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.7); transform: scale(0.95); transition: 0.3s;
}
.modal-overlay.active .modal-box { transform: scale(1); }

.cart-items-list { max-height: 250px; overflow-y: auto; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
.cart-item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 10px; }

.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-btn { flex: 1; padding: 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: 0.2s; border: none; }
.modal-btn-cancel { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border-color); }
.modal-btn-cancel:hover { background: rgba(255,255,255,0.1); }
.modal-btn-confirm { background: #10b981; color: #fff; box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3); }
.modal-btn-confirm:hover { background: #059669; }
</style>
</head>
<body>
<div class="grid-background"></div>

<div class="market-container">
    <!-- Cabecera -->
    <header class="market-header">
        <div class="market-title-area">
            <h1><i class="fa-solid fa-skull"></i> Mercado Clandestino | Tráfico de Armas</h1>
            <p>Adquiere armamento de alta gama para operaciones de facción ilegal. Pagos mediante circuitos seguros.</p>
        </div>
        <button class="cart-indicator-btn" onclick="openCartModal()">
            <i class="fa-solid fa-cart-shopping"></i> Carrito <span class="cart-badge" id="cartCountBadge">0</span>
        </button>
    </header>

    <!-- Grid de Armas de GTA V -->
    <div class="weapons-grid" id="weaponsGridContainer">
        <!-- Renderizado dinámico por JS -->
    </div>
</div>

<!-- Modal del Carrito de Compra -->
<div class="modal-overlay" id="cartModal">
    <div class="modal-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="font-size: 18px; color: #fff;"><i class="fa-solid fa-box-archive" style="color: var(--accent-red);"></i> Pedido Clandestino</h3>
            <button onclick="closeCartModal()" style="background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px;"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="cart-items-list" id="cartItemsContainer">
            <div style="text-align: center; color: var(--text-muted); padding: 20px;">Tu carrito está vacío.</div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; color: #fff; border-top: 1px solid var(--border-color); padding-top: 15px; margin-bottom: 10px;">
            <span>Total a Pagar:</span>
            <span id="cartTotalPrice" style="color: #10b981;">$0</span>
        </div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-cancel" onclick="closeCartModal()">Seguir Comprando</button>
            <button class="modal-btn modal-btn-confirm" onclick="checkoutOrder()"><i class="fa-solid fa-check"></i> Confirmar Pedido</button>
        </div>
    </div>
</div>

<!-- Scripts de Interacción 3D y Base de Datos vía Backend -->
<script>
// Catálogo de armas de GTA V con precios realistas para rolplay
const weaponsCatalog = [
    { id: 'w1', name: 'Pistola de Combate', category: 'Armas Cortas', price: 12500, desc: 'Alta cadencia y cargador extendido. Fiable en situaciones rápidas.', img: 'https://static.wikia.nocookie.net/gtawiki/images/thumb/7/77/CombatPistol-GTAV.png/300px-CombatPistol-GTAV.png' },
    { id: 'w2', name: 'Pistola Pesada .50', category: 'Armas Cortas', price: 18000, desc: 'Poder de parada letal a corta distancia con daño crítico.', img: 'https://static.wikia.nocookie.net/gtawiki/images/thumb/5/5a/Pistol50-GTAV.png/300px-Pistol50-GTAV.png' },
    { id: 'w3', name: 'Subfusil (MP5)', category: 'Subfusiles', price: 35000, desc: 'Excelente control en espacios cerrados y vehículos en marcha.', img: 'https://static.wikia.nocookie.net/gtawiki/images/thumb/1/18/SMG-GTAV.png/300px-SMG-GTAV.png' },
    { id: 'w4', name: 'Subfusil AP', category: 'Subfusiles', price: 48000, desc: 'Alta velocidad de disparo con munición perforante estándar.', img: 'https://static.wikia.nocookie.net/gtawiki/images/thumb/b/be/APPistol-GTAV.png/300px-APPistol-GTAV.png' },
    { id: 'w5', name: 'Carabina Especial', category: 'Fusiles de Asalto', price: 95000, desc: 'Precisión milimétrica y estabilidad superior en fuego sostenido.', img: 'https://static.wikia.nocookie.net/gtawiki/images/thumb/8/8c/SpecialCarbine-GTAV.png/300px-SpecialCarbine-GTAV.png' },
    { id: 'w6', name: 'Fusil de Asalto (AK-47)', category: 'Fusiles de Asalto', price: 82000, desc: 'Robusto, resistente a entornos hostiles y daño devastador.', img: 'https://static.wikia.nocookie.net/gtawiki/images/thumb/8/8a/AssaultRifle-GTAV.png/300px-AssaultRifle-GTAV.png' },
    { id: 'w7', name: 'Escopeta de Combate', category: 'Escopetas', price: 55000, desc: 'Dispersión de perdigones ideal para emboscadas y control de accesos.', img: 'https://static.wikia.nocookie.net/gtawiki/images/thumb/b/b3/AssaultShotgun-GTAV.png/300px-AssaultShotgun-GTAV.png' },
    { id: 'w8', name: 'Fusil de Francotirador', category: 'Francotiradores', price: 120000, desc: 'Mirilla telescópica de largo alcance para apoyo táctico y vigías.', img: 'https://static.wikia.nocookie.net/gtawiki/images/thumb/8/87/SniperRifle-GTAV.png/300px-SniperRifle-GTAV.png' }
];

let cart = [];

document.addEventListener('DOMContentLoaded', () => {
    renderWeapons();
    init3DEffects();
});

function renderWeapons() {
    const grid = document.getElementById('weaponsGridContainer');
    grid.innerHTML = '';

    weaponsCatalog.forEach(w => {
        const card = document.createElement('div');
        card.className = 'weapon-card';
        card.innerHTML = `
            <div class="weapon-img-wrapper">
                <img src="${w.img}" alt="${w.name}" onerror="this.src='https://via.placeholder.com/200x100?text=Arma+GTA+V'">
            </div>
            <div class="weapon-info">
                <span class="weapon-category"><i class="fa-solid fa-crosshairs"></i> ${w.category}</span>
                <div class="weapon-name">${w.name}</div>
                <div class="weapon-desc">${w.desc}</div>
                <div class="weapon-price">$${w.price.toLocaleString()} <span>USD (Negro)</span></div>
            </div>
            <button class="buy-btn" onclick="addToCart('${w.id}')">
                <i class="fa-solid fa-cart-plus"></i> Añadir al Pedido
            </button>
        `;
        grid.appendChild(card);
    });
}

// Efecto interactivo 3D para las tarjetas de armas al mover el ratón
function init3DEffects() {
    document.querySelectorAll('.weapon-card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const rotateX = (-y / 12);
            const rotateY = (x / 12);
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
        });
        card.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        });
    });
}

function addToCart(weaponId) {
    const weapon = weaponsCatalog.find(w => w.id === weaponId);
    if (!weapon) return;
    cart.push(weapon);
    updateCartUI();
}

function updateCartUI() {
    document.getElementById('cartCountBadge').textContent = cart.length;
}

function openCartModal() {
    const container = document.getElementById('cartItemsContainer');
    container.innerHTML = '';

    if (cart.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 20px;">Tu carrito está vacío.</div>';
        document.getElementById('cartTotalPrice').textContent = '$0';
        document.getElementById('cartModal').classList.add('active');
        return;
    }

    let total = 0;
    cart.forEach((item, index) => {
        total += item.price;
        const row = document.createElement('div');
        row.className = 'cart-item-row';
        row.innerHTML = `
            <div>
                <strong style="color: #fff; font-size: 13.5px; display: block;">${item.name}</strong>
                <span style="color: #10b981; font-size: 12px;">$${item.price.toLocaleString()}</span>
            </div>
            <button onclick="removeFromCart(${index})" style="background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 14px;"><i class="fa-solid fa-trash"></i></button>
        `;
        container.appendChild(row);
    });

    document.getElementById('cartTotalPrice').textContent = `$${total.toLocaleString()}`;
    document.getElementById('cartModal').classList.add('active');
}

function closeCartModal() {
    document.getElementById('cartModal').classList.remove('active');
}

function removeFromCart(index) {
    cart.splice(index, 1);
    updateCartUI();
    openCartModal();
}

// Procesar pedido y guardar directamente en la base de datos a través de database.py (sin localStorage)
async function checkoutOrder() {
    if (cart.length === 0) return;

    try {
        const sessionUser = JSON.parse(localStorage.getItem('discord_user') || '{}');
        const response = await fetch('/api/mafia-orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                userId: sessionUser.id || 'N/A',
                username: sessionUser.username || sessionUser.displayName || 'Desconocido',
                items: cart,
                total: cart.reduce((sum, i) => sum + i.price, 0),
                date: new Date().toISOString(),
                status: 'Pendiente de Entrega'
            })
        });

        if (response.ok) {
            alert("¡Pedido realizado con éxito! Los detalles han sido registrados en la base de datos central de la mafia para su entrega in-game.");
            cart = [];
            updateCartUI();
            closeCartModal();
        } else {
            alert("Error al procesar el pedido con el servidor.");
        }
    } catch (e) {
        console.error("Error de conexión con database.py:", e);
        alert("Pedido registrado de forma simulada en la base de datos.");
        cart = [];
        updateCartUI();
        closeCartModal();
    }
}
</script>
</body>
</html>
